<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - PUT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="post.html">Cadastrar</a>
        <a href="get.html">Listar</a>
        <a href="put.html">Atualizar</a>
        <a href="delete.html">Excluir</a>
    </nav>
    <main>
        <h1>Atualizar - PUT</h1>
        <form id="form-busca" class="busca">
            <input type="text" id="cpfBusca" placeholder="Digite o CPF para busca">
            <button type="submit">Buscar</button>
        </form>
        <form id="form-put">
            <label>ID <input type="text" id="id" readonly></label>
            <div class="grid">
            <label>CPF <input type="text" id="cpf" placeholder="000.000.000-00" required></label>
            <label>Nome <input type="text" id="nome" required></label>
            <label>Sobrenome <input type="text" id="sobrenome" required></label>
            <label>E-mail <input type="email" id="email" required></label>
            <label>Idade <input type="number" id="idade" min="0" required></label>
            <label>Telefone <input type="text" id="telefone" placeholder="(11) 90000-0000" required></label>
            <label>Rua <input type="text" id="rua" required></label>
            <label>Bairro <input type="text" id="bairro" required></label>
            <label>Cidade <input type="text" id="cidade" required></label>
            <label>Estado <input type="text" id="estado" maxlength="2" placeholder="SP" required></label>
            <label>RG <input type="text" id="rg" required></label>
            </div>
            <button type="submit">Atualizar</button>
        </form>
        <p id="mensagem"></p>
    </main>
    <script src="put/put.js"></script>
</body>
</html>
